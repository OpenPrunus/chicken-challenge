name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js-unit:
    name: JavaScript (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run lint
      - run: npm run test:unit

  php-quality:
    name: PHP 8.5 (PSR-12, static analysis, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring
          tools: composer
          coverage: none
      - name: Syntax check of every PHP file
        run: |
          find src server web tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Coding standard (PSR-12)
        run: composer cs
      - name: Static analysis (PHPStan, level 8)
        run: composer stan
      - name: Unit tests
        run: composer test

  integration:
    name: Multiplayer server (integration tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring
          tools: composer
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress --no-dev
      - name: Start the real PHP WebSocket server and play against it
        run: npm run test:integration

  browser:
    name: Mobile browser (emulated touch device)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring
          tools: composer
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress --no-dev
      - name: Drive headless Chrome with an emulated phone (layout, orientation, touch aiming and catching)
        run: npm run test:browser
        env:
          CHROME_BIN: google-chrome

  docker:
    name: Docker image (smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t chicken-challenge:ci .
      - name: Start the website with a bind-mounted data directory (as in production)
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          sudo chown 33:33 "$RUNNER_TEMP/data"
          docker run -d --name web -p 8080:80 -v "$RUNNER_TEMP/data:/var/www/html/data" \
            -e CHICKEN_WS=wss://example.test/ws -e CHICKEN_MIN_POINT_SECONDS=0 chicken-challenge:ci
          docker run -d --name ws -p 8081:8081 --user 33:33 -v "$RUNNER_TEMP/data:/var/www/html/data" \
            -e WS_ALLOWED_ORIGINS=https://example.test chicken-challenge:ci php /opt/chicken/server.php
          for i in $(seq 1 30); do curl -fs http://localhost:8080/ >/dev/null && break; sleep 1; done
      - name: Smoke test
        run: |
          set -eu
          B=http://localhost:8080
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(code $B/)" = 200
          curl -s $B/ | grep -q 'wss:\\/\\/example.test\\/ws'
          for f in engine.js i18n.js game.js style.css; do test "$(code $B/assets/$f)" = 200; done
          for f in manifest.webmanifest sw.js icons/icon-192.png; do test "$(code $B/$f)" = 200; done
          # the API needs a signed ticket (delivered when a game starts), validates scores and persists them on the host
          TOK=$(openssl rand -hex 16)
          ticket() { curl -s -X POST -H 'Content-Type: application/json' -d '{"action":"start","token":"'$TOK'","level":1}' $B/api.php | jq -r .ticket; }
          score() { code -X POST -H 'Content-Type: application/json' -d '{"ticket":"'$1'","name":"ci","me":'$2',"opp":'$3'}' $B/api.php; }
          T=$(ticket); test -n "$T" -a "$T" != null
          test "$(score $T 4 3)" = 422                                  # not a valid final score ...
          test "$(score $T 4 1)" = 200                                  # ... and the ticket was not consumed by that failure
          test "$(score $T 4 1)" = 403                                  # a ticket works only once
          test "$(code -X POST -H 'Content-Type: application/json' -d '{"name":"ci","me":12,"opp":0}' $B/api.php)" = 403   # no ticket: refused
          test "$(score forged.ticket 12 0)" = 403
          test "$(code -X POST -d 'not json' $B/api.php)" = 400
          test "$(code -X DELETE $B/api.php)" = 405
          curl -s $B/api.php | grep -q '"name":"ci"'
          ! curl -s $B/api.php | grep -q '"th"'                          # token hashes are never published
          sudo grep -q '"name":"ci"' "$RUNNER_TEMP/data/scores.json"
          # a name is reserved by the first token that uses it
          TOK2=$(openssl rand -hex 16); T2=$(curl -s -X POST -H 'Content-Type: application/json' -d '{"action":"start","token":"'$TOK2'","level":1}' $B/api.php | jq -r .ticket)
          test "$(score $T2 12 0)" = 403
          # the scores directory must never be served, even though the bind mount hides its .htaccess
          test "$(code $B/data/scores.json)" = 403
          test "$(code $B/data/)" = 403
          # if the file is not writable, the API must fail loudly (500, JSON) and not leak PHP warnings or paths
          sudo chown root:root "$RUNNER_TEMP/data/scores.json"
          sudo chmod 644 "$RUNNER_TEMP/data/scores.json"
          T3=$(ticket)
          out="$(curl -s -w ' HTTP=%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"ticket":"'$T3'","name":"ci","me":4,"opp":1}' $B/api.php)"
          echo "$out"
          echo "$out" | grep -q '{"error":"storage"} HTTP=500'
          ! echo "$out" | grep -qi 'warning\|fatal\|/var/www'
          # reads keep working
          curl -s $B/api.php | grep -q '"name":"ci"'
          # the multiplayer server shares the data directory (as www-data, like in production)
          docker logs ws | grep -q 'Ranking: 0 player(s) loaded from /var/www/html/data/multi_scores.json'
          ! docker logs ws | grep -q WARNING
          # multiplayer leaderboard: written by the game server, served by the API without any token hash
          test "$(curl -s "$B/api.php?board=multi")" = '[]'
          printf '%s' '{"version":1,"players":{"alice":{"name":"Alice","th":"secrethash","rating":1020,"played":1,"wins":1,"losses":0,"gf":4,"ga":0}}}' \
            | sudo tee "$RUNNER_TEMP/data/multi_scores.json" > /dev/null
          sudo chmod 644 "$RUNNER_TEMP/data/multi_scores.json"
          curl -s "$B/api.php?board=multi" | grep -q '"rating":1020'
          ! curl -s "$B/api.php?board=multi" | grep -q secrethash
          test "$(code $B/data/multi_scores.json)" = 403
          for f in secret.key abuse.json api.lock; do test "$(code $B/data/$f)" = 403; done      # anti-abuse state is never served
          # the WebSocket server is up and enforces its origin list
          docker logs ws | grep -q 'listening'
          H='Connection: Upgrade'; U='Upgrade: websocket'; V='Sec-WebSocket-Version: 13'; K='Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ=='
          curl -s -i --max-time 3 -H "$H" -H "$U" -H "$V" -H "$K" -H 'Origin: https://example.test' http://localhost:8081/ | head -1 | grep -q 101
          curl -s -i --max-time 3 -H "$H" -H "$U" -H "$V" -H "$K" -H 'Origin: https://evil.test' http://localhost:8081/ | head -1 | grep -q 400
      - name: Container logs
        if: failure()
        run: docker logs web; docker logs ws
