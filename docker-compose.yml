services:
  chicken:                       # site web (PHP 8.5 + Apache)
    build: .
    ports:
      - "8080:80"
    environment:
      # URL WebSocket vue par le navigateur ; vide = même hôte, port 8081
      CHICKEN_WS: ""
    volumes:
      - scores:/var/www/html/data
    restart: unless-stopped

  chicken-ws:                    # serveur multijoueur (même image, autre commande)
    build: .
    command: ["php", "/opt/chicken/server.php"]
    ports:
      - "8081:8081"
    volumes:
      - scores:/var/www/html/data   # classement multijoueur (écrit ici, lu par le site)
    environment:
      WS_PORT: "8081"
      WS_ALLOWED_ORIGINS: ""     # ex. "https://jeu.exemple.fr" pour restreindre
      TRUSTED_PROXIES: ""        # reverse proxies dont on croit X-Real-IP (vide = réseaux privés)
      CHICKEN_MAX_CONN_PER_IP: "10"      # connexions simultanées par adresse
      CHICKEN_MAX_ACCOUNTS_PER_IP: "3"   # comptes classés par adresse sur la fenêtre
      CHICKEN_ALLOW_SAME_IP: "0"         # 1 = autoriser le classement entre joueurs de la même adresse
    restart: unless-stopped

volumes:
  scores:
